# Example workflow for Python computational analysis
# Copy this to .gitea/workflows/compute.yml in your repository

name: Python Analysis
on: [push]

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: |
          apt-get update && apt-get install -y python3 python3-pip
          pip3 install numpy pandas matplotlib scipy seaborn jupyter

      - name: Run analysis script
        run: python3 analysis.py

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: analysis-results-${{ github.sha }}
          path: |
            *.png
            *.jpg
            *.pdf
            *.csv
            *.txt
            *.log
            results/
            figures/
            output/
