# Example workflow for GPU-accelerated deep learning with TensorFlow
# Copy this to .gitea/workflows/compute.yml in your repository

name: GPU TensorFlow Training
on: [push]

jobs:
  train:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install TensorFlow with GPU support
        run: |
          apt-get update && apt-get install -y python3 python3-pip
          pip3 install tensorflow[and-cuda]
          pip3 install numpy matplotlib pandas scikit-learn

      - name: Verify GPU availability
        run: |
          python3 << 'EOF'
          import tensorflow as tf
          print(f"TensorFlow version: {tf.__version__}")
          print(f"GPU devices: {tf.config.list_physical_devices('GPU')}")
          print(f"Built with CUDA: {tf.test.is_built_with_cuda()}")
          if tf.config.list_physical_devices('GPU'):
              print("GPU is available and will be used for training")
          else:
              print("WARNING: No GPU detected!")
          EOF

      - name: Run training
        run: python3 train_model.py

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: tf-training-results-${{ github.sha }}
          path: |
            *.png
            *.h5
            *.keras
            *.log
            models/
            logs/
            tensorboard/
